<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cesium 圆环示例</title>
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.120/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.120/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <style>
        html, body, #cesiumContainer {
            width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden;
        }
    </style>
</head>
<body>
    <div id="cesiumContainer"></div>
    <script>
        const viewer = new Cesium.Viewer('cesiumContainer', {
            baseLayerPicker: false
        });

        // 定义圆心位置（例如：经度、纬度、高度）
        const center = Cesium.Cartesian3.fromDegrees(-75.0, 40.0, 100000.0);

        // 定义圆的半径（米）
        const radius = 50000.0;

        // 定义圆环的顶点数
        const numPoints = 100;
        const positions = [];

        // 计算圆周上的顶点
        for (let i = 0; i < numPoints; i++) {
            const angle = (i / numPoints) * Cesium.Math.TWO_PI;
            const x = radius * Math.cos(angle);
            const y = radius * Math.sin(angle);
            const point = Cesium.Cartesian3.fromElements(x, y, 0);
            const rotatedPoint = Cesium.Matrix4.multiplyByPoint(
                Cesium.Transforms.eastNorthUpToFixedFrame(center),
                point,
                new Cesium.Cartesian3()
            );
            positions.push(rotatedPoint);
        }

        // 将第一个点重复一次，形成闭合的圆环
        positions.push(positions[0]);

        // 创建 PolylineGeometry
        const polylineGeometry = new Cesium.PolylineGeometry({
            positions: positions,
            width: 5.0
        });

        // 创建并添加 Primitive 到场景
        const instance = new Cesium.GeometryInstance({
            geometry: polylineGeometry,
            attributes: {
                color: Cesium.ColorGeometryInstanceAttribute.fromColor(Cesium.Color.RED)
            }
        });

        viewer.scene.primitives.add(new Cesium.Primitive({
            geometryInstances: instance,
            appearance: new Cesium.PolylineColorAppearance()
        }));

        // 设置视角，聚焦到圆环
        viewer.zoomTo(viewer.scene.primitives);
    </script>
</body>
</html>
