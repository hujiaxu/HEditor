<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cesium GeometryInstance 和 Primitive modelMatrix 示例</title>
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.120/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.120/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <style>
        html, body, #cesiumContainer {
            width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden;
        }
    </style>
</head>
<body>
    <div id="cesiumContainer"></div>
    <script>
        const viewer = new Cesium.Viewer('cesiumContainer', {
            baseLayerPicker: false
        });

        // 定义盒子的几何体
        const boxGeometry = new Cesium.BoxGeometry({
            maximum: new Cesium.Cartesian3(50000.0, 50000.0, 50000.0),
            minimum: new Cesium.Cartesian3(-50000.0, -50000.0, -50000.0)
        });

        // 创建一个 GeometryInstance 并设置模型矩阵（局部变换）
        const boxInstance = new Cesium.GeometryInstance({
            geometry: boxGeometry,
            modelMatrix: Cesium.Transforms.eastNorthUpToFixedFrame(
                Cesium.Cartesian3.fromDegrees(-75.0, 40.0, 300000.0)  // 定位到特定位置
            ),
            attributes: {
                color: Cesium.ColorGeometryInstanceAttribute.fromColor(Cesium.Color.BLUE.withAlpha(0.5))
            }
        });

        // 创建 Primitive 并应用初始 modelMatrix（全局变换）
        const primitive = viewer.scene.primitives.add(new Cesium.Primitive({
            geometryInstances: boxInstance,
            appearance: new Cesium.PerInstanceColorAppearance({
                closed: true,
                translucent: false
            }),
            modelMatrix: Cesium.Matrix4.IDENTITY // 初始为单位矩阵
        }));

        // 设置视角
        viewer.zoomTo(viewer.scene.primitives);

        // 动态改变 Primitive 的 modelMatrix
        viewer.clock.onTick.addEventListener(() => {
            const time = viewer.clock.currentTime.secondsOfDay;
            const angle = Cesium.Math.toRadians(time * 10); // 10度
            console.log('angle: ', angle);
            const rotationMatrix = Cesium.Matrix4.fromRotationTranslation(Cesium.Matrix3.fromRotationZ(angle));
            primitive.modelMatrix = rotationMatrix;  // 应用旋转
        });
    </script>
</body>
</html>
