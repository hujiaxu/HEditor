<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js 几何体融入 Cesium</title>
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.88/Build/Cesium/Cesium.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.88/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <style>
        html, body, #cesiumContainer {
            width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden;
        }
    </style>
</head>
<body>
    <div id="cesiumContainer"></div>
    <script>
        // 初始化 Cesium Viewer
        const viewer = new Cesium.Viewer('cesiumContainer', {
            terrainProvider: Cesium.createWorldTerrain(),
            baseLayerPicker: false
        });

        // 创建 Three.js 几何体（立方体）
        const boxGeometry = new THREE.BoxGeometry(1, 1, 1);

        // 将 Three.js 几何体数据转换为 Cesium 格式
        const positions = [];
        const indices = [];
        for (let i = 0; i < boxGeometry.attributes.position.array.length; i += 3) {
            positions.push(boxGeometry.attributes.position.array[i]);
            positions.push(boxGeometry.attributes.position.array[i + 1]);
            positions.push(boxGeometry.attributes.position.array[i + 2]);
        }

        for (let i = 0; i < boxGeometry.index.array.length; i += 3) {
            indices.push(boxGeometry.index.array[i]);
            indices.push(boxGeometry.index.array[i + 1]);
            indices.push(boxGeometry.index.array[i + 2]);
        }

        console.log('positions: ', positions);
        const boundingSphere = Cesium.BoundingSphere.fromVertices(positions);
        // 创建 Cesium 几何体
        const cesiumGeometry = new Cesium.Geometry({
            attributes: {
                position: new Cesium.GeometryAttribute({
                    componentDatatype: Cesium.ComponentDatatype.DOUBLE,
                    componentsPerAttribute: 3,
                    values: new Float64Array(positions)
                })
            },
            indices: new Uint16Array(indices),
            primitiveType: Cesium.PrimitiveType.TRIANGLES,
            boundingSphere
        });

        // 创建 Cesium 几何体实例
        const geometryInstance = new Cesium.GeometryInstance({
            geometry: cesiumGeometry,
            modelMatrix: Cesium.Matrix4.multiplyByTranslation(
                Cesium.Transforms.eastNorthUpToFixedFrame(
                    Cesium.Cartesian3.fromDegrees(-115.0, 37.0)
                ),
                new Cesium.Cartesian3(0.0, 0.0, 0.5),
                new Cesium.Matrix4()
            ),
            attributes: {
                color: Cesium.ColorGeometryInstanceAttribute.fromColor(Cesium.Color.BLUE)
            }
        });

        // 创建 Cesium Primitive
        const primitive = new Cesium.Primitive({
            geometryInstances: geometryInstance,
            appearance: new Cesium.PerInstanceColorAppearance({
                flat: true,
                renderState: {
                    depthTest: {
                        enabled: true
                    }
                }
            })
        });

        // 将 Primitive 添加到场景中
        viewer.scene.primitives.add(primitive);

        // 设置视角
        // viewer.zoomTo(boundingSphere);

        console.log('boundingSphere.center: ', boundingSphere.center);
        viewer.scene.camera.flyTo({
            destination: boundingSphere.center
        });

    </script>
</body>
</html>
